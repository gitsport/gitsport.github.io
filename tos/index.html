<!DOCTYPE html>
<html lang="ru" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Условия использования - GitSport</title>
    <!-- Минимальный набор favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="description" content="Условия использования сервиса GitSport">
    <meta property="og:title" content="Условия использования">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gitsport.github.io/tos">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/i18n.js" defer></script>
    <script src="/js/themes.js" defer></script>
    <script src="/js/useful.js" defer></script>
	<script src="/js/main.js" defer></script>
</head>
<body>
    <div class="app">
        <header class="header">
			<div class="header__container">
				<a href="/" class="logo-link" id="logoLink">
					<img src="/assets/logo/logo_EN.svg" alt="GitSport" class="logo__img" id="logoImg">
				</a>
				<div class="theme-switcher">
					<button class="theme-btn" data-theme="system">Системная</button>
					<button class="theme-btn" data-theme="light">Светлая</button>
					<button class="theme-btn" data-theme="dark">Тёмная</button>
				</div>
				<div class="lang-selector">
					<button class="lang-btn" id="langBtn">
						<img src="/assets/flags/ru.png" alt="ru" class="flag-icon" id="currentFlag">
						<span id="currentLangName">Русский</span>
					</button>
					<div class="lang-dropdown" id="langDropdown"></div>
				</div>
			</div>
		</header>
			<main style="max-width: 900px; margin: 2rem auto; padding: 2rem;">
				<h1 data-i18n="tos_title">Условия использования</h1>
				<div class="tos-content" data-i18n="tos_content">
					<p><strong>Дата последнего обновления:</strong> 12 мая 2026 г.</p>
					<h2>1. Общие положения</h2>
					<p>Настоящие Условия использования регулируют отношения между администрацией сайта GitSport и пользователем...</p>
				</div>
			</main>
        <footer class="footer">
            <div class="footer__links">
                <a href="/privacy">Политика конфиденциальности</a>
                <a href="/tos">Условия использования</a>
                <a href="/useful">Полезные инструменты</a>
            </div>
            <div class="footer__copyright">© 2026 GitSport</div>
        </footer>
    </div>
    <script>
        // минимальная инициализация тем и языка
        if (typeof initThemes === 'function') initThemes();
        if (typeof initLanguageSelector === 'function') initLanguageSelector();
